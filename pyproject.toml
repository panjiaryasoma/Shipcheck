[project]
name = "shipcheck"
version = "0.1.0"
description = "Autonomous preflight inspection for software submissions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.116",
  "google-adk>=1.17",
  "google-genai>=1.0",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
